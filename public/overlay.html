<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nioret Translate — OBS Overlay</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&display=swap");
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; font-family: "DM Sans", sans-serif; }
      body { display: flex; align-items: flex-end; padding: 4vh 3vw; }
      #messages { width: min(760px, 86vw); display: flex; flex-direction: column; gap: 12px; }
      .message { position: relative; overflow: hidden; padding: 16px 19px 16px 22px; border: 1px solid rgba(255,255,255,.18); border-radius: 14px; color: white; background: linear-gradient(115deg, rgba(12,10,21,.92), rgba(26,20,42,.87)); box-shadow: 0 16px 50px rgba(0,0,0,.28); animation: enter .35s cubic-bezier(.2,.8,.2,1); }
      .message::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: linear-gradient(#65e5ea, #a879ff); }
      .meta { display: flex; align-items: center; gap: 9px; margin-bottom: 5px; font-size: 12px; }.meta strong { font-weight: 700; }.meta span { color: rgba(255,255,255,.56); font-size: 10px; text-transform: uppercase; }
      .text { margin: 0; font-size: clamp(19px, 2.1vw, 31px); font-weight: 600; line-height: 1.25; text-shadow: 0 2px 4px rgba(0,0,0,.6); }
      #status { position: fixed; top: 18px; right: 20px; padding: 7px 10px; border-radius: 999px; color: rgba(255,255,255,.65); background: rgba(10,8,17,.62); font-size: 10px; opacity: 0; transition: opacity .2s; }
      #status.show { opacity: 1; }
      @keyframes enter { from { opacity: 0; transform: translateY(18px) scale(.98); } }
    </style>
  </head>
  <body>
    <div id="messages" aria-live="polite"></div>
    <div id="status"></div>
    <script>
      const messages = document.querySelector("#messages");
      const status = document.querySelector("#status");
      const language = new URLSearchParams(location.search).get("language") || "en";
      let socket;
      function showStatus(text) { status.textContent = text; status.classList.add("show"); clearTimeout(showStatus.timer); showStatus.timer = setTimeout(() => status.classList.remove("show"), 3500); }
      function addMessage(message) {
        const item = document.createElement("article"); item.className = "message";
        const meta = document.createElement("div"); meta.className = "meta";
        const user = document.createElement("strong"); user.textContent = message.chatterName; user.style.color = message.color || "#65e5ea";
        const source = document.createElement("span"); source.textContent = `${message.sourceLanguageCode} → ${message.targetLanguageCode}`;
        const text = document.createElement("p"); text.className = "text"; text.textContent = message.translatedText;
        meta.append(user, source); item.append(meta, text); messages.append(item);
        while (messages.children.length > 4) messages.firstElementChild.remove();
        setTimeout(() => { item.style.transition = "opacity .45s"; item.style.opacity = "0"; setTimeout(() => item.remove(), 500); }, 12000);
      }
      function connect() {
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        socket = new WebSocket(`${protocol}//${location.host}/live?language=${encodeURIComponent(language)}`);
        socket.addEventListener("message", (event) => {
          const payload = JSON.parse(event.data);
          if (payload.type === "translation") addMessage(payload.message);
          if (payload.type === "translation_error") showStatus(payload.detail);
          if (payload.type === "status" && payload.status.phase !== "live") showStatus(payload.status.detail);
        });
        socket.addEventListener("close", () => { showStatus("Overlay reconnecting…"); setTimeout(connect, 2000); }, { once: true });
      }
      connect();
    </script>
  </body>
</html>
